version: 2

updates:
  # Keeps the commit SHAs pinned in .github/workflows/*.yml current, rewriting the
  # trailing version comment along with the SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      go-modules:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
